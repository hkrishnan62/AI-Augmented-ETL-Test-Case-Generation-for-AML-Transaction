[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tycat"
version = "1.0.0"
description = "Typology-Conditioned AI Testing (TyCAT) for AML ETL test generation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "TyCAT Contributors" }
]
keywords = ["aml", "etl", "testing", "fincen", "compliance", "llm"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Testing",
  "Topic :: Security"
]
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "matplotlib>=3.8",
  "click>=8.1",
  "jsonschema>=4.21"
]

[project.optional-dependencies]
llm = [
  "openai>=1.30",
  "anthropic>=0.25"
]
spark = [
  "pyspark>=3.5",
  "great-expectations>=0.18",
  "pandera>=0.18"
]
ml = [
  "xgboost>=2.0"
]
gnn = [
  "torch>=2.2",
  "torch-geometric>=2.5"
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=4.1",
  "ruff>=0.4",
  "hypothesis>=6.100"
]

[project.scripts]
tycat = "tycat.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E203"]
